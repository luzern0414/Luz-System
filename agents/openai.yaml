interface:
  display_name: "Luz System"
  short_description: "Approval-gated system design: software function design (pages, entrances, tab bars, components, button actions), prototype behaviour and hardware; visuals belong to Luz Design"
  default_prompt: "Design the whole system with Luz System. First run py -X utf8 scripts/context.py list and read the rule card for each task kind in scope (system-design, client-docs, function-list, interaction, remote-config, admin-list, admin-dashboard, admin-form, miniprogram, commerce, agent-ui, agent-runtime-ui, platform-console, website, prototype, hardware; list shows all 26) — preferences, lessons, rule text cut from ui-standards.html, the surface pages, system-design.html and hardware-design.html, tools and checks; client files are PDF and Excel only, so function lists, business logic and hardware lists are written as data (features.json, plan.json) and checked with features_check.py and hw_export.py; the look of any interface (composition, cards, buttons, icons, images, motion, themes) is Luz Design's, read its cards interface-visual, interface-components, interface-layout, interface-pattern, interface-motion, interface-icons and never put visual values into system design; templates, the prototype skeleton and hw_build.py are skeletons only. Preserve numbered sessions in D:/Codes/skill输出/Luz-System, human approval gates, evidence and browser verification; record BRIEF 采用的规则 and 本次沉淀 (experience.py note) before publish.py."
